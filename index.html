<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小测局</title>
<style>
/* Layout: single-column phone app — test shelf → one question per screen → result: portrait/type header, long report (free or locked), screenshot share card */
:root{
  --bg:#f2f3f8; --surface:#ffffff; --ink:#1d2033; --muted:#6a6f86; --line:#e1e3ee; --soft:#e9ebf4;
  --brand:#ff5a3c; --ok:#1f9d6b; --ad:#f0a020;
  --display:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151d;--surface:#1f2130;--ink:#eceef7;--muted:#9aa0b8;--line:#2f3246;--soft:#282b3c;--brand:#ff7559;--ok:#3cc28d;--ad:#f5b13c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14151d;--surface:#1f2130;--ink:#eceef7;--muted:#9aa0b8;--line:#2f3246;--soft:#282b3c;--brand:#ff7559;--ok:#3cc28d;--ad:#f5b13c;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.5px}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top h1{font-size:40px;line-height:1.1}
.top h1 span{color:var(--brand)}
.top p{margin:4px 0 0;color:var(--muted)}
.bundle{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px}
.bundle div{flex:1;min-width:0}
.bundle b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.bundle small{opacity:.75;font-size:12px}
.bundle button,.cta{border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.bundle.done{background:var(--soft);color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;width:100%}
.card:active{transform:scale(.99)}
.glyph{flex:none;width:54px;height:54px;border-radius:14px;background:var(--c);color:#fff;font-family:var(--display);font-size:30px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.glyph svg,.av svg,.glyph img,.av img{width:100%;height:100%;display:block}
.card .txt{flex:1;min-width:0}
.card h3{font-size:20px}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.tag{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag.adt{background:var(--ad);color:#fff}
.tag.open{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.foot{color:var(--muted);font-size:12px;text-align:center;line-height:1.6}
.heroCard{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;border:0;border-radius:22px;padding:20px 18px;background:linear-gradient(135deg,#e0832e,#c8412f);color:#fff;cursor:pointer;width:100%;box-shadow:0 10px 24px rgba(200,65,47,.25)}
.heroCard:active{transform:scale(.99)}
.heroAvs{display:flex}
.heroAvs .av{width:58px;height:58px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.9);margin-right:-12px;background:#fff}
.heroTxt{display:flex;flex-direction:column;gap:4px}
.heroTxt b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2}
.heroTxt small{font-size:14px;opacity:.92;line-height:1.5}
.heroGo{background:#fff;color:#c8412f;font-weight:700;border-radius:999px;padding:9px 18px;font-size:15px}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.strip b{color:var(--brand)}
.strip .arrow{font-size:20px;line-height:1;color:var(--muted)}
.strip.on{justify-content:center;color:var(--ok);border-style:solid}
/* gender */
.gender{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gbtn{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--display);font-size:24px}
.gbtn:hover{border-color:var(--c)}
.gbtn .av{width:100px;height:100px}
.gbtn small{font-family:var(--body);font-size:12px;color:var(--muted)}
/* quiz */
.qbar{display:flex;align-items:center;gap:12px}
.back{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:6px 0;white-space:nowrap}
.prog{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .25s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.qtitle{font-size:13px;color:var(--c);font-weight:600}
.q{font-size:26px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 16px;text-align:left;font-size:16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--c)}
.opt:active{background:var(--soft)}
.likert .opt{display:flex;align-items:center;gap:12px;padding:13px 16px}
.likert .opt i{flex:none;border-radius:50%;border:2px solid var(--c);box-sizing:border-box}
.priceNote{font-size:12px;color:var(--muted);text-align:center;margin:0}
/* result */
.hero{background:var(--c);color:#fff;border-radius:20px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:4px}
.hero.withav{align-items:center;text-align:center}
.hero .av{width:170px;height:170px;border-radius:50%;border:5px solid rgba(255,255,255,.85);margin-bottom:6px;overflow:hidden}
.hero small{opacity:.88;font-size:13px}
.hero h2{font-size:44px;line-height:1.15}
.hero p{margin:0;font-size:16px}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.free{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.sec .body{display:flex;flex-direction:column;gap:20px}
.sec h3{font-size:22px}
.sec p{margin:0}
.sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.blk{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:13px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:6.2em 1fr 3em;align-items:center;gap:8px;font-size:13px}
.bar .t{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.duos{display:flex;flex-direction:column;gap:14px}
.duo .ends{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.duo .ends.n{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.duo .track{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--soft));margin:4px 0}
.duo .track i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--c);transform:translate(-50%,-50%);box-sizing:border-box}
.pair{margin:0}
.pair b{display:block;font-size:14px}
.duo-chars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px}
.mini .av{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden}
.mini div{min-width:0;font-size:13px;line-height:1.5}
.mini b{display:block;font-size:14px}
.shadows{display:flex;gap:14px;flex-wrap:wrap}
.shadows div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;width:72px;text-align:center}
.shadows .av{width:60px;height:60px;border-radius:50%;overflow:hidden}
.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dex div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;text-align:center;line-height:1.3}
.dex .av{width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;overflow:hidden}
.dex .off .av{filter:grayscale(1) brightness(.9);opacity:.45}
.dex .me .av{outline:3px solid var(--c);outline-offset:2px}
.locked .body{filter:blur(7px);user-select:none;pointer-events:none;max-height:900px;overflow:hidden}
.lock{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px 16px}
.lock>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-align:center;max-width:320px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.lock b{font-family:var(--display);font-weight:400;font-size:22px}
.lock ul{text-align:left;margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
.ghost{border:1.5px solid var(--line);background:none;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.adbtn{border:0;border-radius:999px;background:var(--ad);color:#fff;font-weight:600;font-size:15px;padding:10px 16px;cursor:pointer}
.gate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:20px}
.gate .av{width:180px;height:180px;border-radius:50%;overflow:hidden;filter:blur(14px) grayscale(.4);opacity:.85}
.gate h2{font-size:30px}
.gate p{margin:0;color:var(--muted)}
.gate .adbtn{font-size:18px;padding:14px 26px}
.share{border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.share .av{width:120px;height:120px;border-radius:50%;overflow:hidden}
.share .glyph{width:64px;height:64px;font-size:36px}
.share h3{font-size:30px;color:var(--c)}
.share small{color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1;min-width:130px;border-radius:999px;padding:12px;font-size:15px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface)}
.row .pri{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.more{display:flex;flex-direction:column;gap:8px}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(10,12,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;box-sizing:border-box;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:24px}
.plan{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:none;text-align:left;width:100%;font-size:15px}
.plan.sel{border-color:var(--brand)}
.plan b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.plan small{display:block;color:var(--muted);font-size:12px}
.demo{font-size:12px;color:var(--brand);text-align:center;margin:0}
.paybtn{border:0;border-radius:999px;background:var(--ok);color:#fff;font-size:17px;font-weight:600;padding:14px;cursor:pointer}
.paybtn.ad{background:var(--ad)}
.paybtn[disabled]{opacity:.7}
.adplay{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.adplay .num{font-family:var(--display);font-size:64px;line-height:1;color:var(--ad);font-variant-numeric:tabular-nums}
.adplay p{margin:0;color:var(--muted);text-align:center;font-size:13px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:22px;height:6px;border-radius:9px;background:var(--soft)}
.dots i.on{background:var(--ad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}h1,h2,h3,.bundle b,.lock b,.adplay .num,.glyph,.gbtn,.heroTxt b,.sheet h3{font-weight:800}</style>

<body>


<div class="wrap" id="app"></div>
<div class="ov" id="ov" hidden></div>

<script>
/* ---------- 几何切面风格头像（代码绘制，立体光照） ---------- */
const LP=(()=>{
  const INK='#2a2230';
  const rgb=h=>{if(h.length===4)h='#'+[...h.slice(1)].map(c=>c+c).join('');return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))};
  const cl=v=>Math.round(Math.max(0,Math.min(255,v)));
  const tone=(h,f)=>{const c=rgb(h).map(v=>f>=1?v+(255-v)*(f-1):v*f);return '#'+c.map(v=>cl(v).toString(16).padStart(2,'0')).join('')};
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const LN=(()=>{const v=[-0.42,-0.68,0.6];const l=Math.hypot(...v);return v.map(x=>x/l)})();
  const f1=n=>n.toFixed(1);
  const tri=(a,b,c,fill)=>`<path d="M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}L${f1(c[0])} ${f1(c[1])}Z" fill="${fill}" stroke="${fill}" stroke-width=".6" stroke-linejoin="round"/>`;
  function shade(a,b,c,col){
    const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
    if(n[2]<0)n=n.map(x=>-x);const l=Math.hypot(...n)||1;
    const d=(n[0]*LN[0]+n[1]*LN[1]+n[2]*LN[2])/l;
    return tone(col,.8+.36*d+(rnd()-.5)*.05);
  }
  // 立体切面：多边形被分成三圈三角面，按“鼓起来”的高度计算明暗
  function facet(pts,col,h=.3){
    const n=pts.length;let cx=0,cy=0,ar=0;
    pts.forEach((p,i)=>{cx+=p[0];cy+=p[1];const q=pts[(i+1)%n];ar+=p[0]*q[1]-q[0]*p[1]});cx/=n;cy/=n;
    const H=Math.sqrt(Math.abs(ar)/2)*h;
    const ring=(t,z)=>pts.map(p=>[cx+(p[0]-cx)*t+(rnd()-.5)*1.4*t,cy+(p[1]-cy)*t+(rnd()-.5)*1.4*t,H*z]);
    const R=[pts.map(p=>[p[0],p[1],0]),ring(.68,.58),ring(.32,.9)];const C=[cx,cy,H];
    let o='';
    for(let r=0;r<2;r++)for(let i=0;i<n;i++){const j=(i+1)%n;const A=R[r][i],B=R[r][j],Cc=R[r+1][j],D=R[r+1][i];o+=tri(A,B,Cc,shade(A,B,Cc,col))+tri(A,Cc,D,shade(A,Cc,D,col))}
    for(let i=0;i<n;i++){const j=(i+1)%n;o+=tri(C,R[2][i],R[2][j],shade(C,R[2][i],R[2][j],col))}
    return o;
  }
  const flat=(pts,col,op=1)=>`<path d="M${pts.map(p=>f1(p[0])+' '+f1(p[1])).join('L')}Z" fill="${col}"${op<1?` opacity="${op}"`:''}/>`;
  const line=(d,col,w,op=1)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${op<1?` opacity="${op}"`:''}/>`;
  const poly=(cx,cy,r,n=6,rot=0,sx=1,sy=1)=>Array.from({length:n},(_,i)=>{const a=rot*Math.PI/180+i*2*Math.PI/n;return [cx+Math.cos(a)*r*sx,cy+Math.sin(a)*r*sy]});
  const mir=pts=>pts.map(([x,y])=>[200-x,y]);
  const rot=(pts,cx,cy,deg)=>{const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return pts.map(([x,y])=>[cx+(x-cx)*c-(y-cy)*s,cy+(x-cx)*s+(y-cy)*c])};
  const sc=(pts,cx,cy,sx,sy=sx)=>pts.map(([x,y])=>[cx+(x-cx)*sx,cy+(y-cy)*sy]);
  const mv=(pts,dx,dy)=>pts.map(([x,y])=>[x+dx,y+dy]);
  const both=(pts,col,h)=>facet(pts,col,h)+facet(mir(pts),col,h);
  const ringPath=(cx,cy,r,n,r0=0,sx=1,sy=1)=>{const p=poly(cx,cy,r,n,r0,sx,sy);return 'M'+p.map(q=>f1(q[0])+' '+f1(q[1])).join('L')+'Z'};
  const flower=(x,y,c='#ffd1dc',cc='#f2c14e',r=4)=>[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*2*Math.PI/5;return facet(poly(x+Math.cos(a)*r*1.15,y+Math.sin(a)*r*1.15,r,6),c,.35)}).join('')+flat(poly(x,y,r*.55,6),cc);

  /* ---- 通用部件 ---- */
  const BODY=[[6,206],[12,180],[30,163],[58,152],[84,147],[116,147],[142,152],[170,163],[188,180],[194,206]];
  const FACE=[[60,86],[63,66],[72,52],[86,44],[100,42],[114,44],[128,52],[137,66],[140,86],[138,104],[131,120],[118,133],[100,140],[82,133],[69,120],[62,104]];
  const P={
    body:(c,w=1)=>facet(sc(BODY,100,206,w,1),c,.14),
    robe:(c,trim,inner='#f6efe4',w=1)=>P.body(c,w)
      +facet([[84,147],[116,147],[100,172]],inner,.12)
      +facet([[78,149],[87,146],[103,178],[98,186]],trim,.2)+facet([[122,149],[113,146],[102,174],[97,170]],trim,.2),
    armor:(c,plate)=>P.body(c)+facet(poly(40,170,25,7),plate,.3)+facet(poly(160,170,25,7),plate,.3)
      +facet([[78,160],[122,160],[118,178],[82,178]],plate,.2)+facet([[82,182],[118,182],[114,200],[86,200]],plate,.2),
    neck:(s)=>facet([[87,114],[113,114],[116,152],[84,152]],tone(s,.92),.12)+flat([[86,126],[114,126],[113,136],[100,142],[87,136]],tone(s,.7),.5),
    ears:(s)=>{const e=[[53,89],[59,83],[66,87],[66,111],[60,114],[54,105]];return both(e,s,.25)+flat([[57,92],[61,89],[63,94],[63,106],[59,105]],tone(s,.82))+flat(mir([[57,92],[61,89],[63,94],[63,106],[59,105]]),tone(s,.82))},
    face:(s,w=1,hh=1)=>facet(sc(FACE,100,90,w,hh),s,.24),
    nose:(s)=>flat([[97,104],[103,104],[105.5,112],[100,114.5],[94.5,112]],tone(s,.86))+flat([[99,104],[101.5,104],[101,110],[99,110]],tone(s,1.12)),
    eyes:(t='n',iris=INK,y=98,which=[85,115])=>{
      let o='';
      which.forEach(cx=>{
        if(t==='shut'){o+=line(`M${cx-8} ${y} Q${cx} ${y-6} ${cx+8} ${y}`,INK,2.8);return}
        if(t==='smile'){o+=line(`M${cx-8} ${y-1} Q${cx} ${y+5} ${cx+8} ${y-1}`,INK,2.8);return}
        const big=t==='big',sharp=t==='sharp'||t==='fox',stern=t==='stern';
        const hy=big?7:stern?4:sharp?4.2:5.5,wx=big?9:8.5;
        const up=t==='fox'?(cx<100?-2.5:-2.5):0;
        const sh=[[cx-wx,y+(t==='fox'?(cx<100?2:-2.5):0)],[cx-wx*.45,y-hy],[cx+wx*.45,y-hy],[cx+wx,y+(t==='fox'?(cx<100?-2.5:2):0)],[cx+wx*.45,y+hy*.85],[cx-wx*.45,y+hy*.85]];

  function bgLayer(col){
    const N=5,g=[];
    for(let i=0;i<=N;i++){g.push([]);for(let j=0;j<=N;j++){const x=j*200/N,y=i*200/N;const e=(i>0&&i<N&&j>0&&j<N);g[i].push([x+(e?(rnd()-.5)*24:0),y+(e?(rnd()-.5)*24:0),rnd()*18])}}
    let o='';
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){const a=g[i][j],b=g[i][j+1],c=g[i+1][j+1],d=g[i+1][j];
      if((i+j)%2){o+=tri(a,b,c,shade(a,b,c,col))+tri(a,c,d,shade(a,c,d,col))}else{o+=tri(a,b,d,shade(a,b,d,col))+tri(b,c,d,shade(b,c,d,col))}}
    return o+flat(poly(100,96,74,24),tone(col,1.18),.35);
  }
  const CAMP={qj:{n:'取经团',c:'#e39b2d'},tt:{n:'天庭',c:'#3d7fc1'},mw:{n:'魔王',c:'#c8412f'},jg:{n:'精怪',c:'#8150b5'},rj:{n:'人间',c:'#3a9a6b'}};
  function draw(k,camp){
    seed=7+[...k].reduce((s,c)=>s+c.charCodeAt(0)*31,0)%9973;
    const id='cp'+k+(draw.n=(draw.n||0)+1);
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="角色头像"><defs><clipPath id="${id}"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#${id})">${bgLayer(CAMP[camp].c)}${D[k]()}</g></svg>`;
  }
  return {draw,CAMP,keys:Object.keys(D)};
})();

function workAnalyze(ans){
  const {s,n}=tally(WORK_ITEMS,ans);
  const t=s.tz>=0,b=s.bj>=0,j=s.sj>=0;
  const k=t?(b?(j?'yx':'sl'):(j?'wn':'lh')):(b?(j?'my':'qx'):(j?'qf':'jj'));const T=WORK_T[k];
  return {n:T.n,tag:T.tag,free:`你的职场口头禅：“${T.quote}”`,
   sections:[
    ['你的打工人格',H.p(T.p)],
    ['你的关键词',H.chips(T.keys)],
    ['你的职场三维',H.duo([['工作投入',pct(s.tz,n.tz),'能省则省'],['边界清晰',pct(s.bj,n.bj),'不会拒绝'],['社交活跃',pct(s.sj,n.sj),'低调安静']])],
    ['你的一天',H.p(T.day)],
    ['你的职场口头禅',H.p('<b>“'+T.quote+'”</b>')],
    ['你的优势',H.ul(T.s)],['你的短板',H.ul(T.b)],
    ['领导眼中的你',H.p(T.boss)],['同事眼中的你',H.p(T.mate)],
    ['适合你的公司和岗位',H.p(T.fit)],

   ]};
}

 [['为了更高的收益，我愿意承担亏钱的风险','fx',1],['我宁愿收益低一点，也要保证本金安全','fx',-1],['听说有赚钱的机会，我会很想试一试','fx',1],['我对股票、基金这类投资很感兴趣','fx',1],['把钱放在银行最让我安心','fx',-1],['我能接受投资短期内亏损','fx',1],['没把握的事，我一分钱都不会投','fx',-1],['我觉得想发财就得敢冒险','fx',1]],
 [['我不太好意思主动谈钱，比如谈薪资、要账','hb'],['只要钱更多，我的烦恼就会少一大半','cb'],['我在意别人觉得我有没有钱','dw'],['我会时刻关注自己的账户余额','jt'],['钱多了反而会带来麻烦','hb'],['我觉得钱能解决大部分问题','cb'],['用的东西好，会让我更有面子','dw'],['花钱的时候，我经常有负罪感','jt']]
]);
function moneyAnalyze(ans){
  const {s,n}=tally(MONEY_ITEMS,ans);
  const sp=s.xf>0,rk=s.fx>0;const k=sp?(rk?'mx':'xl'):(rk?'tz':'wj');const T=MONEY_T[k];
  const bel=['hb','cb','dw','jt'].sort((a,b)=>s[b]-s[a]);const B=MONEY_BEL[bel[0]];
  return {n:T.n,tag:T.tag,free:`你的金钱信念偏向「${B.n}」`,
   sections:[
    ['你的理财画像',H.p(T.p)],
    ['你的关键词',H.chips(T.keys)],
    ['你的理财维度',H.duo([['享受当下',pct(s.xf,n.xf),'节制储蓄'],['敢于冒险',pct(s.fx,n.fx),'稳字当头']])],
    ['你的消费习惯',H.p(T.habit)],
    ['你的金钱信念：'+B.n,H.p(B.p)+H.p('<b>'+B.tip+'</b>')],
    ['四种金钱信念',H.bars(bel.map(x=>[MONEY_BEL[x].n.replace('金钱观',''),pct(s[x],n[x])]))],
    ['你的优势',H.ul(T.s)],['需要注意',H.ul(T.b)],
    ['你最容易踩的坑',H.p(T.trap)],
    ['给你的理财建议',H.ul(T.a)],
    ['说明',H.p('以上内容是根据你的答题给出的通用参考，不构成任何具体的投资建议。')]
   ]};
}

const XY_TEST={id:'xiyou',name:'你是西游记里的谁',sub:'44个西游角色，男女各22个，附专属角色头像',c:'#d9782b',price:0};
const ALL=[XY_TEST,...PAID_TESTS];
const BUNDLE=1.99,PASS_DAYS=3,ADS_NEEDED=5;
const XY_BY={};XY.forEach(c=>XY_BY[c.k]=c);
const byName=s=>{const nm=s.split('。')[0];return XY.find(c=>c.n===nm)};
const AV_URL={};
const avUrl=k=>{if(!AV_URL[k]){const svg=LP.draw(k,XY_BY[k].camp);try{AV_URL[k]=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}))}catch(e){AV_URL[k]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}}return AV_URL[k]};
const av=(k,cls='av')=>`<span class="${cls}"><img src="${avUrl(k)}" alt="${XY_BY[k].n}"></span>`;

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const isOpen=t=>t.price===0||unlocked.has(t.id)||passActive();

const priceTag=t=>t.price>0&&isOpen(t)?'<span class="tag open">已解锁</span>':'';
const glyphOf=t=>t.id==='xiyou'?`<span class="glyph"><img src="${avUrl('wk')}" alt=""></span>`:`<span class="glyph">${t.glyph}</span>`;
const qCount=t=>t.id==='xiyou'?XY_QS.length:t.items.length;

let Q=null,last=null;

/* ---------- 西游 ---------- */
function gender(){

  const nm=XY.filter(c=>c.g==='m').length,nf=XY.filter(c=>c.g==='f').length;
  app.innerHTML=`

  <div class="gender">
    <button class="gbtn" type="button" data-g="m">${av('ts')}男生<small>${nm}个角色等你解锁</small></button>
    <button class="gbtn" type="button" data-g="f">${av('nr')}女生<small>${nf}个角色等你解锁</small></button>
  </div>`;
  on('back',home);
  app.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>{Q.g=b.dataset.g;quiz()});
}
function xyCompute(g,ans){
  const sum=[0,0,0,0];ans.forEach(v=>v.forEach((x,j)=>sum[j]+=x));
  const u=sum.map((x,j)=>x/XY_CAL.sd[j]);
  const r=XY.filter(c=>c.g===g).map(c=>{const p=XY_CAL.proto[c.k];const d=Math.sqrt(p.reduce((a,x,j)=>a+(x-u[j])**2,0));return {k:c.k,s:d+(XY_CAL.bias[c.k]||0)}}).sort((a,b)=>a.s-b.s);
  // 契合度：第一名明显最高，其余依次递减，至少低7个百分点
  r[0].m=Math.max(86,Math.min(98,Math.round(86+(r[1].s-r[0].s)*12)));
  for(let i=1;i<r.length;i++){let m=Math.round(r[0].m-7-(r[i].s-r[1].s)*10-(i-1)*2);m=Math.min(m,r[i-1].m-(i===1?7:2));r[i].m=Math.max(35,m)}
  const dims=u.map(x=>Math.round(Math.max(4,Math.min(96,50+50*Math.max(-1,Math.min(1,x/2.2))))));
  return {ranked:r,dims};
}
function xyGate(){
  const r=xyCompute(Q.g,Q.ans);last={kind:'xy',g:Q.g,...r};
  app.innerHTML=`
  <div class="gate">${av(r.ranked[0].k)}
    <h2>你的西游角色已生成</h2>
    <p>看一段广告，揭晓你是谁，并查看完整的角色报告</p>
    <button class="adbtn" type="button" id="watch">▶ 看广告查看结果</button>
    <button class="back" type="button" id="toHome">返回测试合集</button>
  </div>`;
  on('watch',()=>watchAd('看完即可查看你的西游角色',()=>xyResult(last)));
  on('toHome',home);scrollTo(0,0);
}
function xyResult(r){

  app.style.setProperty('--c',XY_TEST.c);
  app.innerHTML=`
  <div class="hero withav" style="--c:${camp.c}">${av(C.k)}<small>你是西游记里的</small><h2>${C.n}</h2>
    <div class="pills"><span class="pill">阵营：${camp.n}</span><span class="pill">契合度 ${top.m}%</span></div><p style="margin-top:6px">${C.tag}</p></div>
  <div class="sec"><div class="body">
    <h3>${C.n} · 完整角色报告</h3>
    ${blk('你的性格画像',H.p(C.p))}
    ${blk('原著里的'+C.n,H.p(C.story))}
    ${blk('你的四个性格维度',H.duo(XY_DIMS.map((d,i)=>[d[0],r.dims[i],d[1]])))}
    ${blk('性格优势',H.ul(C.s))}
    ${blk('性格短板',H.ul(C.b))}
    ${blk('工作中的你',H.p(C.work))}
    ${blk('感情中的你',H.p(C.love))}
    ${blk('朋友眼中的你',H.p(C.friend))}
    ${blk('给你的建议',H.ul(C.a))}
    ${blk('取经路上的搭档和冤家',`<div class="duo-chars">${M?`<div class="mini">${av(M.k)}<div><b>最佳搭档</b>${C.mate}</div></div>`:''}${R?`<div class="mini">${av(R.k)}<div><b>命中冤家</b>${C.rival}</div></div>`:''}</div>`)}
    ${blk('你身上还有这些角色的影子',`<div class="shadows">${r.ranked.slice(1,4).map(o=>`<div>${av(o.k)}${XY_BY[o.k].n}<span style="color:var(--muted);font-size:12px">${o.m}%</span></div>`).join('')}</div>`)}
    ${blk(`角色图鉴（已解锁 ${XY.filter(c=>c.g===r.g&&seen.has(c.k)).length}/${XY.filter(c=>c.g===r.g).length}）`,`<div class="dex">${XY.filter(c=>c.g===r.g).map(c=>`<div class="${c.k===C.k?'me':seen.has(c.k)?'':'off'}">${av(c.k)}${seen.has(c.k)?c.n:'？？？'}</div>`).join('')}</div><p style="font-size:12px;color:var(--muted)">换个心情再测一次，或者让朋友来测，解锁更多角色。</p>`)}
  </div></div>
  <div class="share" style="--c:${camp.c}">${av(C.k)}<small>你是西游记里的谁 · ${camp.n}</small><h3>我是${C.n}</h3><p style="margin:0">${C.tag}</p><small>截图发朋友圈，看看朋友是哪个角色 · 小测局</small></div>
  <div class="row"><button class="pri" type="button" id="again">再测一次</button><button type="button" id="toHome">测试合集</button></div>
  ${moreCards(XY_TEST)}`;
  on('again',()=>start(XY_TEST));on('toHome',home);bindMore();scrollTo(0,0);
}

/* ---------- 答题 ---------- */
function quiz(){
  const {t,i}=Q;const xy=t.id==='xiyou';const total=qCount(t);
  app.style.setProperty('--c',t.c);
  let body;
  if(xy){const [q,opts]=XY_QS[i];body=`<h2 class="q">${q}</h2><div class="opts">${opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${o[0]}</button>`).join('')}</div>`}
  else{const it=t.items[i];const sz=[26,22,18,22,26];body=`<h2 class="q">${it[0]}</h2><div class="opts likert">${LIKERT.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><i style="width:${sz[k]}px;height:${sz[k]}px"></i>${o[0]}</button>`).join('')}</div>`}
  app.innerHTML=`
  <div class="qbar"><button class="back" type="button" id="back">‹ ${i?'上一题':'返回'}</button><div class="prog"><i style="width:${i/total*100}%"></i></div><span class="count">${i+1} / ${total}</span></div>
  <div class="qtitle">${t.name}${xy?'':' · 凭第一感觉选'}</div>${body}
`;
  on('back',()=>{if(Q.i===0)return xy?gender():home();Q.i--;Q.ans.pop();quiz()});
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;Q.ans.push(xy?XY_QS[i][1][k][1]:LIKERT[k][1]);
    if(Q.i<total-1){Q.i++;quiz()}else if(xy)xyGate();else result(t,Q.ans);
  });
}

/* ---------- 付费测试结果 ---------- */
function result(t,ans){
  last={kind:'paid',t,ans};
  const R=t.analyze(ans),open=isOpen(t),ads=adCount[t.id]||0;
  app.style.setProperty('--c',t.c);
  app.innerHTML=`
  <div class="hero"><small>${t.name} · 你的类型</small><h2>${R.n}</h2><p>${R.tag}</p><div class="free">${R.free}</div></div>
  <div class="sec ${open?'':'locked'}">
    <div class="body"><h3>${R.n} · 完整报告</h3>${R.sections.map(s=>`<div class="blk"><div class="lbl">${s[0]}</div>${s[1]}</div>`).join('')}</div>
    ${open?'':`<div class="lock"><div><b>解锁完整报告</b>
      <ul>${t.teaser.map(x=>`<li>${x}</li>`).join('')}<li>共${R.sections.length}个板块的深度分析</li></ul>
      <button class="cta" type="button" id="pOne">${t.price}元 解锁这份报告</button>
      <button class="adbtn" type="button" id="pAd">▶ 看${ADS_NEEDED}个广告免费解锁（${ads}/${ADS_NEEDED}）</button>
      <button class="ghost" type="button" id="pAll">${BUNDLE}元 ${PASS_DAYS}天内全部解锁</button></div></div>`}
  </div>
  <div class="share"><span class="glyph">${t.glyph}</span><small>${t.name}</small><h3>我是${R.n}</h3><p style="margin:0">${R.tag}</p><small>截图发给朋友，看看他是哪一型 · 小测局</small></div>
  <div class="row"><button class="pri" type="button" id="again">再测一次</button><button type="button" id="toHome">测试合集</button></div>
  ${moreCards(t)}`;
  on('pOne',()=>pay(t,'one'));on('pAd',()=>pay(t,'ad'));on('pAll',()=>pay(t,'all'));
  on('again',()=>start(t));on('toHome',home);bindMore();scrollTo(0,0);
}
function moreCards(t){
  const others=ALL.filter(x=>x.id!==t.id).slice(0,2);
  return `<div class="more"><div class="lbl" style="color:var(--muted)">再测一个</div>${others.map(x=>`
    <button class="card" type="button" data-id="${x.id}" style="--c:${x.c}">${glyphOf(x)}<span class="txt"><h3>${x.name}</h3><p>${x.sub}</p></span>${priceTag(x)}</button>`).join('')}</div>`;
}
function bindMore(){app.querySelectorAll('.more .card').forEach(b=>b.onclick=()=>start(ALL.find(x=>x.id===b.dataset.id)))}
function refresh(){if(!last)return home();last.kind==='xy'?xyResult(last):result(last.t,last.ans)}

/* ---------- 广告与付款（演示） ---------- */
function watchAd(note,done){
  let n=3;
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="广告"><div class="adplay"><span class="lbl" style="color:var(--ad)">激励视频广告</span><span class="num" id="cd">3</span><p>${note}</p><p class="demo">演示：正式版这里播放15到30秒的广告</p></div></div>`;
  ov.hidden=false;
  const tm=setInterval(()=>{n--;const e=$('cd');if(e)e.textContent=n;if(n<=0){clearInterval(tm);ov.hidden=true;done()}},1000);
}
function pay(t,sel){
  sel=sel||(t?'one':'all');
  const draw=()=>{
    const ads=t?(adCount[t.id]||0):0;
    ov.innerHTML=`<div class="sheet" role="dialog" aria-label="解锁报告">
      <h3>选择解锁方式</h3>
      ${t?`<button class="plan ${sel==='one'?'sel':''}" type="button" data-s="one"><span>解锁这份报告<small>${t.name}，永久有效</small></span><b>${t.price}元</b></button>
      <button class="plan ${sel==='ad'?'sel':''}" type="button" data-s="ad"><span>看广告免费解锁<small>看满${ADS_NEEDED}个即可，进度会保存</small></span><b>${ads}/${ADS_NEEDED}</b></button>`:''}
      <button class="plan ${sel==='all'?'sel':''}" type="button" data-s="all"><span>全部解锁（最划算）<small>${PASS_DAYS}天内4个付费测试的完整报告随便看</small></span><b>${BUNDLE}元</b></button>
      ${sel==='ad'?`<div class="dots">${Array.from({length:ADS_NEEDED},(_,i)=>`<i class="${i<ads?'on':''}"></i>`).join('')}</div><button class="paybtn ad" type="button" id="go">▶ 看第${ads+1}个广告</button>`:
        `<button class="paybtn" type="button" id="go">微信支付 ${sel==='one'?t.price:BUNDLE}元</button>`}
      <p class="demo">演示版：广告和付款都是模拟的，正式版接入广告平台和微信支付</p>
      <button class="back" type="button" id="cancel" style="align-self:center">取消</button>
    </div>`;
    ov.querySelectorAll('.plan').forEach(b=>b.onclick=()=>{sel=b.dataset.s;draw()});
    on('cancel',()=>{ov.hidden=true;refresh()});
    on('go',e=>{
      if(sel==='ad'){
        watchAd(`第${ads+1}个，共${ADS_NEEDED}个`,()=>{
          adCount[t.id]=(adCount[t.id]||0)+1;store.set('xcj_ads',adCount);
          if(adCount[t.id]>=ADS_NEEDED){unlocked.add(t.id);store.set('xcj_paid',[...unlocked]);refresh()}
          else{ov.hidden=false;draw()}
        });return;
      }
      const b=e.currentTarget;b.disabled=true;b.textContent='支付中…';
      setTimeout(()=>{
        if(sel==='one'){unlocked.add(t.id);store.set('xcj_paid',[...unlocked])}
        else{passUntil=Date.now()+PASS_DAYS*864e5;store.set('xcj_pass',passUntil)}
        b.textContent='支付成功';setTimeout(()=>{ov.hidden=true;refresh()},500);
      },1100);
    });
  };
  draw();ov.hidden=false;
}
ov.onclick=e=>{if(e.target===ov&&ov.querySelector('.plan'))ov.hidden=true};
home();

</script>
